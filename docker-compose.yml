services:
  # ==================== DATABASE ====================
  luxdem_db:
    image: postgres:15-alpine
    restart: always
    container_name: luxdem_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 5s
      retries: 5
    command: postgres -c max_connections=200 -c idle_session_timeout=150000000
    volumes:
      - ./db_data/:/var/lib/postgresql/data/
    env_file:
      - ./.env
    networks:
      - app-network
  
  # ==================== PGADMIN ====================
  luxdem_pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    container_name: luxdem_pgadmin
    labels:
      # Enable Traefik for this specific "pgadmin" service
      - traefik.enable=true
      # Define the port inside of the Docker service to use
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
      # Make Traefik use this domain in HTTP
      - traefik.http.routers.pgadmin-http.entrypoints=http
      - traefik.http.routers.pgadmin-http.rule=Host(`${pgadmin_url}`)
      # Use the traefik-network network (defined in docker.compose.traefik.yml)
      - traefik.docker.network=traefik-network
      # Make Traefik use this domain in HTTPS
      - traefik.http.routers.pgadmin-https.entrypoints=https
      - traefik.http.routers.pgadmin-https.rule=Host(`${pgadmin_url}`)
      - traefik.http.routers.pgadmin-https.tls=true
      # Use the "le" (Let's Encrypt) resolver
      - traefik.http.routers.pgadmin-https.tls.certresolver=le
      # Plug middleware to redirect HTTP to HTTPS
      - traefik.http.routers.pgadmin-http.middlewares=https-redirect
      - traefik.http.routers.pgadmin-https.middlewares=secured
    env_file:
      - ./.env
    depends_on:
      luxdem_db:
        condition: service_healthy # Wait for DB to be ready
    networks:
      - app-network
      # Use the public network created to be shared between Traefik and
      # any other service that needs to be publicly available with HTTPS
      - traefik-network
  

  # ==================== OLLAMA ====================
  luxdem_ollama:
    image: ollama/ollama:latest
    container_name: luxdem_ollama
    # build:
    #   context: .
    #   dockerfile: Dockerfile.ollama
    #   args:
    #     EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mistral}

    env_file:
      - ./.env
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      TZ: Europe/Paris
    ports:
      - "${ollama_port:-11434}:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped

  # ==================== CHROMA ====================
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: luxdem_chroma
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/data
    networks:
      - app-network

networks:
  app-network:
    name: luxdem-network
  traefik-network:
    external: true
